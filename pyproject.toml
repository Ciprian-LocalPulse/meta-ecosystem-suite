[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meta-ecosystem-suite"
version = "0.1.0"
description = "Unified engine for Meta Graph API compliance, metrics migration, ad policy linting, and API health monitoring."
readme = "README.md"
authors = [
    { name = "Ciprian Stefan Plesca", email = "contact@localpulse.dev" }
]
license = { text = "Proprietary" }
requires-python = ">=3.11"
keywords = ["meta", "graph-api", "marketing-api", "dsa-compliance", "ad-policy", "compliance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic>=2.5.0,<3",
    "pydantic-settings>=2.1.0,<3",
    "httpx>=0.26.0,<1",
    "typer>=0.9.0,<1",
    "rich>=13.7.0,<14",
    "polars>=0.20.0,<2",
    "jinja2>=3.1.0,<4",
    "apscheduler>=3.10.0,<4",
    "tenacity>=8.2.0,<10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0,<9",
    "pytest-asyncio>=0.23.0,<1",
    "pytest-cov>=4.1.0,<6",
    "respx>=0.20.0,<1",
    "ruff>=0.1.0,<1",
    "mypy>=1.7.0,<2",
    "pip-audit>=2.7.0,<3",
    "bandit>=1.7.0,<2",
]

[project.urls]
Homepage = "https://github.com/Ciprian-LocalPulse/meta-ecosystem-suite"
Repository = "https://github.com/Ciprian-LocalPulse/meta-ecosystem-suite"
Issues = "https://github.com/Ciprian-LocalPulse/meta-ecosystem-suite/issues"

[project.scripts]
meta-suite = "meta_ecosystem_suite.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["meta_ecosystem_suite"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
# B113 (request without timeout) is handled centrally in meta_ecosystem_suite/http.py
# via httpx.Timeout(...) on the shared client; individual call sites also pass an
# explicit timeout, so this class of finding is a known false-positive pattern here.
skips = ["B101"]
