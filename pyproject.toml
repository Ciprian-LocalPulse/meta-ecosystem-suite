[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meta-ecosystem-suite"
version = "0.1.0"
description = "Unified engine for Meta Graph API compliance, metrics migration, ad linting, and API health monitoring."
readme = "README.md"

authors = [
    { name = "Ciprian Stefan" }
]

license = { file = "LICENSE" }

requires-python = ">=3.11"

dependencies = [
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "httpx>=0.26.0",
    "typer[all]>=0.9.0",
    "rich>=13.7.0",
    "polars>=0.20.0",
    "jinja2>=3.1.0",
    "apscheduler>=3.10.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.12.0",
    "flake8>=7.0.0"
]

[project.scripts]
meta-suite = "meta_ecosystem_suite.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["meta_ecosystem_suite"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
