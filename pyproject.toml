[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meta-ecosystem-suite"
version = "0.1.0"
description = "Unified engine for Meta Graph API compliance, metrics migration, ad policy linting, and API health monitoring."
readme = "README.md"
authors = [
    { name = "Ciprian Stefan Plesca", email = "contact@localpulse.dev" }
]
license = { text = "Proprietary" }
requires-python = ">=3.11"
keywords = ["meta", "graph-api", "marketing-api", "dsa-compliance", "ad-policy", "compliance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "httpx>=0.26.0",
    "typer[all]>=0.9.0",
    "rich>=13.7.0",
    "polars>=0.20.0",
    "jinja2>=3.1.0",
    "apscheduler>=3.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]

[project.urls]
Homepage = "https://github.com/Ciprian-LocalPulse/meta-ecosystem-suite"
Repository = "https://github.com/Ciprian-LocalPulse/meta-ecosystem-suite"
Issues = "https://github.com/Ciprian-LocalPulse/meta-ecosystem-suite/issues"

[project.scripts]
meta-suite = "meta_ecosystem_suite.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["meta_ecosystem_suite"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
