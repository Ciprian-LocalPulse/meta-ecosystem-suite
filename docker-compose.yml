services:
  meta-suite:
    build: .
    image: meta-ecosystem-suite:local
    env_file:
      - .env
    volumes:
      - ./reports:/app/reports
    command: ["--help"]

  sentinel-cron:
    build: .
    image: meta-ecosystem-suite:local
    env_file:
      - .env
    command: ["sentinel", "check"]
    restart: "no"
